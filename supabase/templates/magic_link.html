<h2>Your sign-in link</h2>
<p>Follow the link below to sign in. This link opens a confirmation page — click the button there to finish signing in.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Sign in</a></p>
<p>Or enter this code on the login page:</p>
<p style="font-size: 24px; font-weight: bold; letter-spacing: 0.1em;">{{ .Token }}</p>
<p>If you did not request this email, you can ignore it.</p>
